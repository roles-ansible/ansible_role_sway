---
- name: Create the `aur_builder` user
  become: true
  ansible.builtin.user:
    name: aur_builder
    create_home: yes
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: yes
    mode: 0644
    validate: 'visudo -cf %s'

- name: Ensure required sway packages are installed from AUR
  kewlfft.aur.aur:
    name: "{{ item }}"
    state: present
    use: auto
  become: true
  become_user: aur_builder
  loop: "{{ sway_packages }}"
  vars:
    sway_packages:
      - 'sway'
      - 'swaylock'
      - 'swaybg'
      - 'swayidle'
      - 'wdisplays'
      - 'waybar'
      - 'cmatrix'
      - "{{ sway__term_pkgs }}"
      - "{{ sway__install_launcher }}"
      - "{{ 'ttf-font-awesome' if sway__dynamic_names | bool else '' }}"
      - "{{ 'swaync' if sway__notification_center | bool else '' }}"
  loop_control:
    label: "{{ item if item is string else item | to_json }}"
  when: item | length > 0